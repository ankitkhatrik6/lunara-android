<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunara BotGuard</title>
<script>
/**
 * BotGuard client for LunaraExtractor.
 *
 * Why this file exists
 * -------------------
 * YouTube's media CDN will only serve a whole song to a client that can prove where
 * the request came from. A live probe of a resolved `IOS` stream showed exactly what
 * happens without that proof:
 *
 *     range@0        -> 206 OK
 *     range@1048576  -> 403 Forbidden      <- capped at exactly 1 MiB
 *     range@2097152  -> 403 Forbidden
 *
 * ExoPlayer buffers that first megabyte, asks for the next one, is refused, and then
 * sits in STATE_BUFFERING forever. That is the "no playback" symptom.
 *
 * The proof is a PO token, produced by Google's BotGuard virtual machine. The VM's
 * bytecode arrives from the network on every run, so it cannot be hard-coded here;
 * everything in this file is the harness that executes it.
 *
 * The flow
 * --------
 *   1. Android asks .../api/jnn/v1/Create for a challenge.
 *   2. This file evaluates the challenge's interpreter, instantiates the VM it names,
 *      runs its program, and takes an async snapshot.
 *   3. Android posts that snapshot to .../GenerateIT and receives an integrity token.
 *   4. The integrity token becomes a minter function, called once per video id.
 */

var bgVmFunctions = null;
var bgVm = null;
var bgProgram = null;
var poTokenMinter = null;

/**
 * Instantiates the VM named by the challenge and runs its program.
 *
 * The program returns its functions through an asynchronous callback, so this polls
 * rather than returning synchronously. The callback is captured into [bgVmFunctions]
 * rather than onto `this`: the VM invokes it detached, so relying on `this` loses the
 * binding and silently never populates anything.
 */
function loadBotGuard(challengeData) {
  bgVm = window[challengeData.globalName];
  bgProgram = challengeData.program;

  if (!bgVm) throw new Error('VM not found in the global object: ' + challengeData.globalName);
  if (!bgVm.a) throw new Error('Could not load the BotGuard program');

  var vmFunctionsCallback = function (
    asyncSnapshotFunction,
    shutdownFunction,
    passEventFunction,
    checkCameraFunction
  ) {
    bgVmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  try {
    bgVm.a(bgProgram, vmFunctionsCallback, true, undefined, function () {}, [[], []]);
  } catch (e) {
    throw new Error('Failed to execute the BotGuard program: ' + e.message);
  }

  return new Promise(function (resolve, reject) {
    var attempts = 0;
    var maxAttempts = 10000; // ~10s at 1ms
    var checkInterval = setInterval(function () {
      if (bgVmFunctions && bgVmFunctions.asyncSnapshotFunction) {
        clearInterval(checkInterval);
        resolve({ vmFunctions: bgVmFunctions, vm: bgVm, program: bgProgram });
      } else if (attempts >= maxAttempts) {
        clearInterval(checkInterval);
        reject(new Error('Timed out waiting for asyncSnapshotFunction'));
      }
      attempts++;
    }, 1);
  });
}

/** Takes a snapshot from a running BotGuard VM. */
function snapshot(botguard, args) {
  return new Promise(function (resolve, reject) {
    if (!botguard.vmFunctions || !botguard.vmFunctions.asyncSnapshotFunction) {
      reject(new Error('Async snapshot function not found'));
      return;
    }
    try {
      botguard.vmFunctions.asyncSnapshotFunction(
        function (response) { resolve(response); },
        [
          args.contentBinding,
          args.signedTimestamp,
          args.webPoSignalOutput,
          args.skipPrivacyBuffer
        ]
      );
    } catch (e) {
      reject(new Error('Snapshot failed: ' + e.message));
    }
  });
}

/**
 * Full challenge run: evaluate the interpreter, start the VM, snapshot it.
 * Resolves to the snapshot string Android posts back to GenerateIT.
 */
function runBotGuard(challengeData) {
  var interpreterJavascript =
    challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;

  if (!interpreterJavascript) {
    throw new Error('Could not load the VM - no interpreter JavaScript in the challenge');
  }

  new Function(interpreterJavascript)();

  var webPoSignalOutput = [];

  return loadBotGuard({ globalName: challengeData.globalName, program: challengeData.program })
    .then(function (botguard) {
      return snapshot(botguard, { webPoSignalOutput: webPoSignalOutput });
    })
    .then(function (botguardResponse) {
      return { webPoSignalOutput: webPoSignalOutput, botguardResponse: botguardResponse };
    });
}
/**
 * Turns an integrity token into a reusable minter.
 *
 * Called exactly once, during initialisation. A second call would rebuild the minter
 * from a stale token, so this guards rather than trusting the caller.
 */
async function createPoTokenMinter(integrityToken) {
  if (poTokenMinter) {
    console.log('[createPoTokenMinter] already initialised, ignoring');
    return;
  }
  if (integrityToken === null || integrityToken === undefined) {
    throw new Error('PMD:Undefined - integrityToken is not defined');
  }

  var getMinter = webPoSignalOutput[0];
  if (!getMinter) throw new Error('PMD:Undefined - webPoSignalOutput[0] is not defined');
  if (typeof getMinter !== 'function') {
    throw new Error('PMD:NotFunction - webPoSignalOutput[0] is not a function');
  }

  var mintCallback;
  try {
    // getMinter() may answer with a promise rather than the function directly.
    var minterResult = getMinter(integrityToken);
    mintCallback = (minterResult && typeof minterResult.then === 'function')
      ? await minterResult
      : minterResult;
  } catch (e) {
    throw new Error('GMC:Failed - getMinter() threw: ' + e.message);
  }

  if (!mintCallback) throw new Error('APF:Undefined - mintCallback is undefined');
  if (typeof mintCallback !== 'function') {
    throw new Error('APF:NotFunction - mintCallback is not a function');
  }

  poTokenMinter = mintCallback;
  console.log('[createPoTokenMinter] minter ready');
}

/**
 * Mints one PO token for [identifier].
 *
 * The identifier is the visitor session id, or a video id when a token bound to one
 * specific track is wanted. The result is a Uint8Array, which Android base64-encodes
 * before attaching it to the InnerTube request.
 */
async function obtainPoToken(identifier) {
  if (!poTokenMinter) {
    throw new Error('MNT:NotInit - createPoTokenMinter was never called');
  }

  var result;
  try {
    var mintResult = poTokenMinter(identifier);
    result = (mintResult && typeof mintResult.then === 'function') ? await mintResult : mintResult;
  } catch (e) {
    throw new Error('MNT:Failed - mintCallback() threw: ' + e.message);
  }

  if (!result) throw new Error('YNJ:Undefined - mint result is undefined');
  if (!(result instanceof Uint8Array)) {
    throw new Error('ODM:Invalid - result is not a Uint8Array');
  }
  // Tokens are ~110-128 bytes. Anything far outside that is not a token.
  if (result.length < 100 || result.length > 140) {
    console.warn('[obtainPoToken] token size ' + result.length + ' is outside the expected range');
  }
  return result;
}
</script>
</head>
<body></body>
</html>
