name: Lunara Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK (izzy flavour)
        # Signed by Gradle with the stable keystore committed at the repository
        # root, so Android accepts updates over previously installed builds.
        run: ./gradlew --console=plain assembleIzzyRelease --warning-mode summary
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/izzy/release/app-izzy-release.apk "dist/lunara-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag may be re-pushed with fixes after the release was first
        # published: in that case replace the APK on the existing release
        # instead of failing on `gh release create`.
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/lunara-*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/lunara-*.apk \
              --title "Lunara ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
