name: Lunara CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Lunara
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run unit tests
        # `:extractor` is tested separately from `:app`: the extractor's behaviour is
        # what decides whether playback works at all, so a failure there must not be
        # buried under an app-wide test task that may not even reach it.
        run: ./gradlew :extractor:testDebugUnitTest :app:testDebugUnitTest --continue

      - name: Build signed release APK
        run: ./gradlew assembleRelease || gradle assembleRelease
        env:
          # Optional overrides. When these secrets are not configured the build
          # falls back to the stable keystore committed at the repository root,
          # so every release is signed with the same (non-debug) key.
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lunara-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lunara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
