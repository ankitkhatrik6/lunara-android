name: Lunara CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lunara (Metrolist base)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Mirrors upstream Metrolist's own CI: assemble one variant. The app is
      # signed by Gradle itself with the stable keystore committed at the
      # repository root (see signingConfigs in app/build.gradle.kts), so no
      # post-build signing step is needed.
      - name: Build release APK (izzy flavour)
        run: ./gradlew --console=plain assembleIzzyRelease --warning-mode summary
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lunara-release-apk
          path: app/build/outputs/apk/izzy/release/*.apk
